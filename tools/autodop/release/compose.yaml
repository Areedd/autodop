services:
  autodop:
    image: autodop/service:20260925
    platform: linux/amd64
    mem_limit: 2g
    cpus: 2
    ports:
      - "127.0.0.1:${AUTODOP_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 24
  fe:
    image: autodop/starrocks:20260925
    platform: linux/amd64
    hostname: fe
    entrypoint: ["/bin/bash", "-c"]
    command: ["mkdir -p /opt/starrocks/fe/meta /opt/starrocks/fe/log && exec /opt/starrocks/fe/bin/start_fe.sh --host_type FQDN"]
    mem_limit: 4g
    cpus: 2
    ports:
      - "127.0.0.1:${MYSQL_PORT:-19030}:9030"
      - "127.0.0.1:${FE_HTTP_PORT:-18030}:8030"
    volumes:
      - fe-meta:/opt/starrocks/fe/meta
    depends_on:
      autodop:
        condition: service_healthy
  be:
    image: autodop/starrocks:20260925
    platform: linux/amd64
    hostname: be
    entrypoint: ["/bin/bash", "-c"]
    command: ["mkdir -p /opt/starrocks/be/storage && exec /opt/starrocks/be/bin/start_be.sh"]
    mem_limit: 4g
    cpus: 2
    volumes:
      - be-data:/opt/starrocks/be/storage
  check:
    image: autodop/service:20260925
    platform: linux/amd64
    profiles: ["check"]
    command: ["python", "smoke.py"]
    environment:
      AUTODOP_ENDPOINT: http://autodop:18080
      MYSQL_HOST: fe
      MYSQL_PORT: 9030
volumes:
  fe-meta:
  be-data:
